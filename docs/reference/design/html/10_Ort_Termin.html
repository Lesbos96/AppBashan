<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ort & Termin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#075C61;text-decoration:none}a:hover{color:#03464B}
a:focus-visible,button:focus-visible{outline:3px solid rgba(7,92,97,.45);outline-offset:2px}
.press{transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.press:active{transform:scale(.98)}
.mn-day{width:100%;height:44px;border:0;background:transparent;font:inherit;font-size:17px;color:#102F35;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;border-radius:22px}
.mn-day:hover{background:rgba(7,92,97,.06)}
@keyframes mnPop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.mn-pop{animation:mnPop .45s cubic-bezier(.3,1.5,.5,1) both}
@media (prefers-reduced-motion: reduce){.mn-pop{animation:none}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F4F4; color: #102F35; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.2px">

  <div style="padding: 54px 20px 0; display: flex; flex-direction: column">
    <div style="height: 44px; margin: 0 -12px; display: flex; align-items: center">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"></path></svg>
        Umzug

      <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: rgba(7,92,97,.10); color: #075C61; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M8 18h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"></path></svg></span>

      <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding-left: 4px">
        <button style="height: 44px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 17px; font-weight: 600; color: #102F35; display: flex; align-items: center; gap: 4px">November 2026<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#075C61" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button>
        <div style="display: flex">
          <button aria-label="Vorheriger Monat" style="width: 44px; height: 44px; border: 0; background: transparent; color: #075C61; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"></path></svg></button>
          <button aria-label="Nächster Monat" style="width: 44px; height: 44px; border: 0; background: transparent; color: #075C61; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg></button>

        <span>MO</span><span>DI</span><span>MI</span><span>DO</span><span>FR</span><span>SA</span><span>SO</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 0">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <button class="mn-day">1</button>
        <button class="mn-day">2</button><button class="mn-day">3</button><button class="mn-day">4</button><button class="mn-day">5</button><button class="mn-day">6</button><button class="mn-day">7</button><button class="mn-day">8</button>
        <button class="mn-day">9</button><button class="mn-day">10</button><button class="mn-day">11</button><button class="mn-day">12</button>
        <button aria-pressed="true" aria-label="Freitag, 13. November 2026, ausgewählt" style="width: 100%; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span class="mn-pop" style="width: 40px; height: 40px; border-radius: 20px; background: linear-gradient(180deg, #0C6E73 0%, #075C61 100%); color: #FFFFFF; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(7,92,97,.28)">13</span></button>
        <button class="mn-day">14</button><button class="mn-day">15</button>
        <button class="mn-day">16</button><button class="mn-day">17</button><button class="mn-day">18</button><button class="mn-day">19</button><button class="mn-day">20</button><button class="mn-day">21</button><button class="mn-day">22</button>
        <button class="mn-day">23</button><button class="mn-day">24</button><button class="mn-day">25</button><button class="mn-day">26</button><button class="mn-day">27</button><button class="mn-day">28</button><button class="mn-day">29</button>
        <button class="mn-day">30</button>
      </div>
    </section>

    <div style="margin-top: 12px; background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 1px rgba(16,47,53,.04), 0 4px 14px rgba(16,47,53,.04)">
      <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: rgba(7,92,97,.10); color: #075C61; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">Fr., 13. Nov. · ca. 5 Stunden</span><span style="font-size: 13px; line-height: 17px; color: #5B7074">Die Startzeit stimmst du mit dem Partner ab. Ohne Prüfung der Verfügbarkeit.</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 112px; padding: 12px 20px 34px; box-sizing: border-box; display: flex; align-items: center; background: rgba(247,250,250,.80); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border-top: 0.5px solid rgba(16,47,53,.12)">
    <a href="11_Zusammenfassung.html" class="press" style="flex: 1; height: 54px; border-radius: 16px; corner-shape: squircle; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #0C6E73 0%, #075C61 55%, #04494E 100%); color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 6px 16px rgba(7,92,97,.22)">Zur Zusammenfassung</a>
  </div>
</div>
</body>
</html>
