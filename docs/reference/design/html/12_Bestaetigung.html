<style>
body{margin:0}
a{color:#075C61;text-decoration:none}a:hover{color:#03464B}
a:focus-visible,button:focus-visible{outline:3px solid rgba(7,92,97,.45);outline-offset:2px}
.press{transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.press:active{transform:scale(.98)}
@keyframes mnScale{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes mnCheck{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes mnRing{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes mnUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.mn-scale{animation:mnScale .6s cubic-bezier(.3,1.5,.5,1) .05s both}
.mn-check{stroke-dasharray:40;stroke-dashoffset:40;animation:mnCheck .45s cubic-bezier(.4,0,.2,1) .45s forwards}
.mn-ring1{animation:mnRing .8s cubic-bezier(.2,1,.3,1) .2s both}
.mn-ring2{animation:mnRing .9s cubic-bezier(.2,1,.3,1) .32s both}
.mn-up{animation:mnUp .6s cubic-bezier(.2,1,.3,1) .5s both}
.mn-up2{animation:mnUp .6s cubic-bezier(.2,1,.3,1) .6s both}
@media (prefers-reduced-motion: reduce){.mn-scale,.mn-ring1,.mn-ring2,.mn-up,.mn-up2{animation:none}.mn-check{animation:none;stroke-dashoffset:0}}
</style>
</head>

      <span style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 13px; color: #5B7074">Richtpreis</span><span style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">689,61 €</span></span>
    </span>
  </a>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 6px">
