.press{transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.press:active{transform:scale(.98)}
@keyframes mnMesh{0%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}50%{transform:translate3d(4%,-3%,0) rotate(7deg) scale(1.06)}100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}}
@keyframes mnDraw{from{stroke-dashoffset:620}to{stroke-dashoffset:0}}
@keyframes mnPulse{0%{opacity:.6;transform:scale(.85)}70%{opacity:0;transform:scale(1.4)}100%{opacity:0;transform:scale(1.4)}}
@keyframes mnFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mn-mesh{animation:mnMesh 36s ease-in-out infinite}
.mn-route{stroke-dasharray:620;stroke-dashoffset:620;animation:mnDraw 2.2s cubic-bezier(.22,.8,.2,1) .3s forwards}
.mn-pulse{transform-box:fill-box;transform-origin:center;animation:mnPulse 2.8s ease-out 2s infinite}
.mn-float{animation:mnFloat 6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.mn-mesh,.mn-pulse,.mn-float{animation:none}.mn-route{animation:none;stroke-dashoffset:0}}
</style>
