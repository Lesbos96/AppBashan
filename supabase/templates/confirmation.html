<h2>Dein Code für MoveNow</h2>
<p>Gib diesen Code in der App ein:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 4px">{{ .Token }}</p>
<p>Oder öffne den Link in dem Browser, in dem du dich anmelden willst:</p>
<p><a href="{{ .SiteURL }}/anmelden#token_hash={{ .TokenHash }}&type=email">Jetzt anmelden</a></p>
<p>Du hast das nicht angefordert? Dann ignoriere diese Mail.</p>
